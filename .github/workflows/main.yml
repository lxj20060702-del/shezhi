name: Streamlit Keepalive

on:
  schedule:
    # UTC时间！北京时间=UTC+8；这里 UTC 12点 = 北京时间20点，每6小时跑一次
    - cron: '0 */6 * * *'
  workflow_dispatch: # 可以手动点运行测试

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chrome

      - name: Run browser visit
        run: node keepalive.js
        env:
          APP_URL: "https://shezhi.streamlit.app" # 👉这里改成你自己的链接！
